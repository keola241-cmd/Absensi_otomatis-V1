<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Rumah Pintar Salatiga</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        /* === VARIABEL TEMA (DARK & LIGHT) === */
        [data-theme="dark"] {
            --bg-main: #060713;
            --card-bg: #141634;
            --card-scanner: #18193f;
            --text-title: #a78bfa;
            --text-sub: #ffffff;
            --text-heading: #ffffff;
            --item-bg: #101229;
            --border-color: #272a5a;
            --sidebar-bg: #101229;
            --btn-bg: #1e204a;
            --scanner-box-bg: #a3a3a3;
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --card-scanner: #ffffff;
            --text-title: #4f46e5;
            --text-sub: #1e293b;
            --text-heading: #0f172a;
            --item-bg: #f1f5f9;
            --border-color: #cbd5e1;
            --sidebar-bg: #ffffff;
            --btn-bg: #e2e8f0;
            --scanner-box-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease, background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: var(--bg-main) !important;
            background-attachment: fixed !important;
            color: var(--text-sub);
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* === HEADER === */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 1.5rem;
        }

        .menu-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--btn-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }

        .menu-btn span {
            width: 24px;
            height: 3px;
            background: var(--text-heading);
            border-radius: 2px;
        }

        .header-title {
            text-align: center;
        }

        .header-title h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-title);
        }

        /* === SIDEBAR TOGGLE === */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: var(--sidebar-bg);
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
            transition: left 0.3s ease;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar h3 {
            font-size: 1.2rem;
            color: var(--text-heading);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .theme-switch-wrapper span {
            color: var(--text-heading);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #8b5cf6;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 99;
        }

        .overlay.active {
            display: block;
        }

        /* === LAYOUT UTAMA === */
        .container {
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel-scanner {
            flex: 1;
            background: var(--card-scanner);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .panel-scanner h3, .panel-daftar h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
            width: 100%;
            color: var(--text-heading);
        }

        /* UN-MIRROR KAMERA SCANNER */
        #reader video {
            transform: scaleX(-1) !important;
            -webkit-transform: scaleX(-1) !important;
            border-radius: 16px;
        }

        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: none !important;
            background: var(--scanner-box-bg);
        }

        #pesan_hasil {
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            background: rgba(0,0,0,0.05);
            width: 100%;
            color: var(--text-heading);
            border: 1px solid var(--border-color);
        }

        .panel-daftar {
            flex: 1.2;
            display: flex;
            flex-direction: column;
        }

        .daftar-header-box {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 0.8rem;
            text-align: center;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }

        #daftar_absen {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            max-height: 480px;
            overflow-y: auto;
        }

        /* ANIMASI SLIDE-IN KANAN KE KIRI */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        #daftar_absen li {
            background: var(--item-bg);
            color: var(--text-heading);
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: slideInRight 0.4s ease-out forwards;
            border: 1px solid var(--border-color);
        }

        /* === RESPONSIVE DESIGN === */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .panel-scanner, .panel-daftar {
                width: 100%;
            }

            .header-title h1 {
                font-size: 1.6rem;
            }
            
            .header-title h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <h3>Pengaturan Tampilan</h3>
        <div class="theme-switch-wrapper">
            <span>Mode Terang</span>
            <label class="switch">
                <input type="checkbox" id="themeToggle" onchange="switchTheme(this)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="theme-switch-wrapper">
            <span>Gunakan Suara (TTS)</span>
            <label class="switch">
                <input type="checkbox" id="voiceToggle" onchange="switchVoice(this)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="header">
        <button class="menu-btn" onclick="toggleSidebar()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-title">
            <h2>Absensi</h2>
            <h1>Rumah Pintar Salatiga</h1>
        </div>
    </div>

    <div class="container">
        <div class="panel-scanner">
            <h3>Scanner QR CODE</h3>
            <div id="reader"></div>
            <div id="pesan_hasil">Menunggu scan...</div>
        </div>

        <div class="panel-daftar">
            <div class="daftar-header-box">
                <h3>Daftar Hadir</h3>
            </div>
            <ul id="daftar_absen"></ul>
        </div>
    </div>

    <script>
        // === TOGGLE SIDEBAR ===
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // === TOGGLE TEMA (DARK / LIGHT) ===
        function switchTheme(checkbox) {
            const theme = checkbox.checked ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }

        // === TOGGLE SUARA (TTS) ===
        function switchVoice(checkbox) {
            localStorage.setItem('useVoice', checkbox.checked);
        }

        // === RESTORE TEMA & PENGATURAN SAAT PERTAMA KALI MUAT ===
        document.addEventListener('DOMContentLoaded', () => {
            // Restore Tema
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.checked = (savedTheme === 'light');
            }

            // Restore Pengaturan Suara (Default: true / aktif)
            const savedVoice = localStorage.getItem('useVoice');
            const voiceToggle = document.getElementById('voiceToggle');
            if (voiceToggle) {
                voiceToggle.checked = (savedVoice !== 'false');
            }

            muatDaftarHadir();
        });

        // === AMBIL RIWAYAT ABSEN ===
        let isProcessing = false;

        function muatDaftarHadir() {
            fetch('/get_riwayat')
                .then(response => response.json())
                .then(data => {
                    let listAbsen = document.getElementById('daftar_absen');
                    listAbsen.innerHTML = '';
                    
                    if (Array.isArray(data)) {
                        data.reverse().forEach(siswa => {
                            tambahItemKeDaftar(siswa);
                        });
                    }
                })
                .catch(err => console.error("Gagal muat data:", err));
        }

        // === FUNGSI SUARA BEEP ('BIB') SANGA RINGAN (WEB AUDIO API) ===
        function playBeep() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Frekuensi 800Hz (Suara Bib Crisp)
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.error("Audio Beep error:", e);
            }
        }

        // === FUNGSI SUARA SPEECH (TEXT TO SPEECH) ===
        function bicara(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let suara = new SpeechSynthesisUtterance(text);
                suara.lang = 'id-ID';
                suara.rate = 1.0;
                window.speechSynthesis.speak(suara);
            }
        }

        // === FUNGSI TAMBAH ITEM DENGAN ANIMASI SLIDE-IN ===
        function tambahItemKeDaftar(siswa) {
            let listAbsen = document.getElementById('daftar_absen');
            let item = document.createElement('li');
            item.innerText = `[${siswa.waktu || ''}] ${siswa.nama || ''} - Kelas ${siswa.kelas || ''} (${siswa.role || ''})`;
            listAbsen.prepend(item);
        }

        // === LOGIKA SCAN QR ===
        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            // 1. BUNYIKAN BEEP SANGAT CEPAT DETIK ITU JUGA SAAT QR TERBACA
            playBeep();

            try {
                scanner.pause(true);
            } catch (e) {}

            const useVoice = document.getElementById('voiceToggle') ? document.getElementById('voiceToggle').checked : true;

            fetch('/proses_absen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_data: decodedText })
            })
            .then(response => response.json())
            .then(data => {
                let textPesan = document.getElementById('pesan_hasil');
                textPesan.innerText = data.message || "Proses selesai";

                // 2. SETELAH PROSES SELESAI -> BARU UCAPKAN SUARA DENGAN TEXT TO SPEECH (JIKA DIAKTIFKAN)
                if (data.status === 'success') {
                    let namaSiswa = data.siswa ? data.siswa.nama : '';
                    if (useVoice) {
                        bicara(`Berhasil Absen, Selamat Datang ${namaSiswa}`);
                    }
                    textPesan.style.color = '#10b981';

                    tambahItemKeDaftar(data.siswa);

                } else if (data.status === 'warning') {
                    if (useVoice) {
                        bicara(data.message);
                    }
                    textPesan.style.color = '#f59e0b';
                } else {
                    if (useVoice) {
                        bicara(data.message || "Terjadi kesalahan!");
                    }
                    textPesan.style.color = '#ef4444';
                }

                setTimeout(() => {
                    isProcessing = false;
                    try {
                        scanner.resume();
                    } catch (e) {}
                }, 3500);
            })
            .catch(err => {
                let textPesan = document.getElementById('pesan_hasil');
                textPesan.innerText = "⚠️ Gangguan Koneksi Server!";
                textPesan.style.color = '#ef4444';
                
                if (useVoice) {
                    bicara("Gangguan koneksi server!");
                }

                setTimeout(() => {
                    isProcessing = false;
                    try {
                        scanner.resume();
                    } catch (e) {}
                }, 3000);
            });
        }

        // INITIALIZE SCANNER
        let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        scanner.render(onScanSuccess);
    </script>
</body>
</html>
