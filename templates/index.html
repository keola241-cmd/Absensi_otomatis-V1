<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absen QR Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(19, 27, 46, 0.8);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(139, 92, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
        }

        .left-panel h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #c084fc;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        #daftar_absen {
            list-style: none;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
        }

        #daftar_absen::-webkit-scrollbar {
            width: 5px;
        }
        #daftar_absen::-webkit-scrollbar-thumb {
            background: var(--accent-purple);
            border-radius: 4px;
        }

        #daftar_absen li {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-purple);
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            border-radius: 8px;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        #daftar_absen li:hover {
            transform: translateX(4px);
            border-left-color: var(--accent-blue);
            background: rgba(30, 41, 59, 0.8);
        }

        .right-panel {
            flex: 1.2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-panel h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #60a5fa;
            width: 100%;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed var(--border-color) !important;
            background: #090d16;
        }

        #reader button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
            transition: opacity 0.2s;
        }

        #reader button:hover {
            opacity: 0.9;
        }

        #pesan_hasil {
            margin-top: 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            min-height: 2.8rem;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .left-panel, .right-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Absensi Siswa Kelas-12</h1>
        <p>Arahkan QR Code ke kamera.</p>
    </div>

    <div class="container">
        <div class="panel left-panel">
            <h3>Daftar Hadir Hari Ini</h3>
            <ul id="daftar_absen"></ul>
        </div>

        <div class="panel right-panel">
            <h3>Scanner QR Code</h3>
            <div id="reader"></div>
            <div id="pesan_hasil">Menunggu scan...</div>
        </div>
    </div>

    <script>
        let isProcessing = false;

        function muatDaftarHadir() {
            fetch('/get_riwayat')
                .then(response => response.json())
                .then(data => {
                    let listAbsen = document.getElementById('daftar_absen');
                    listAbsen.innerHTML = '';
                    
                    if (Array.isArray(data)) {
                        data.reverse().forEach(siswa => {
                            let item = document.createElement('li');
                            item.innerText = `[${siswa.waktu || ''}] ${siswa.nama || ''} - Kelas ${siswa.kelas || ''} (${siswa.role || ''})`;
                            listAbsen.appendChild(item);
                        });
                    }
                })
                .catch(err => console.error("Gagal muat data:", err));
        }

        document.addEventListener('DOMContentLoaded', muatDaftarHadir);

        function bicara(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let suara = new SpeechSynthesisUtterance(text);
                suara.lang = 'id-ID';
                suara.rate = 1.0;
                window.speechSynthesis.speak(suara);
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            try {
                scanner.pause(true);
            } catch (e) {
                console.log("Gagal pause scanner:", e);
            }

            fetch('/proses_absen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_data: decodedText })
            })
            .then(response => response.json())
            .then(data => {
                let textPesan = document.getElementById('pesan_hasil');
                textPesan.innerText = data.message;

                if (data.status === 'success') {
                    let namaSiswa = data.siswa ? data.siswa.nama : '';
                    bicara(`Berhasil Absen, Selamat Datang ${namaSiswa}`);
                    textPesan.style.color = '#34d399';

                    let listAbsen = document.getElementById('daftar_absen');
                    let itemBaru = document.createElement('li');
                    itemBaru.innerText = `[${data.siswa.waktu}] ${data.siswa.nama} - Kelas ${data.siswa.kelas} (${data.siswa.role})`;
                    listAbsen.prepend(itemBaru);

                } else if (data.status === 'warning') {
                    bicara(data.message);
                    textPesan.style.color = '#fbbf24';
                } else if (data.status === 'ditutup') {
                    bicara("Absen sudah ditutup!");
                    textPesan.style.color = '#f87171';
                } else {
                    bicara("Format QR salah!");
                    textPesan.style.color = '#f8fafc';
                }

                setTimeout(() => {
                    isProcessing = false;
                    try {
                        scanner.resume();
                    } catch (e) {
                        console.log("Gagal resume scanner:", e);
                    }
                }, 3500);
            })
            .catch(err => {
                console.error("Error:", err);
                setTimeout(() => {
                    isProcessing = false;
                    try {
                        scanner.resume();
                    } catch (e) {}
                }, 3000);
            });
        }

        let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        scanner.render(onScanSuccess);
    </script>
</body>
</html>
